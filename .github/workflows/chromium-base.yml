name: chromium-base

# First attempt at compiling Chromium's //base with devkitA64 on a Switch target.
# Slow by design: gclient sync (~17 min) + gn gen + ninja base. One round ~30 min.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      WORK: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean || true
          df -h /

      - name: depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /opt/depot_tools
          echo "/opt/depot_tools" >> "$GITHUB_PATH"

      - name: install devkitA64 (latest toolchain; several strategies)
        run: |
          set +e
          echo "=== strategy 1: docker hub tags (find a newer image) ==="
          curl -s "https://hub.docker.com/v2/repositories/devkitpro/devkita64/tags?page_size=30" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print(t['name'],t['last_updated'][:10]) for t in d.get('results',[])]" 2>/dev/null | head -12

          echo "=== strategy 2: devkitPro apt installer (verbose) ==="
          curl -sSI https://apt.devkitpro.org/install-devkitpro-pacman | head -5
          wget -q -O /tmp/inst.sh https://apt.devkitpro.org/install-devkitpro-pacman
          echo "wget rc=$?"
          ls -l /tmp/inst.sh 2>/dev/null
          head -25 /tmp/inst.sh 2>/dev/null
          chmod +x /tmp/inst.sh 2>/dev/null
          sudo bash /tmp/inst.sh
          echo "installer rc=$?"
          command -v dkp-pacman
          sudo dkp-pacman -Syu --noconfirm 2>&1 | tail -8
          sudo dkp-pacman -S --noconfirm --needed switch-dev switch-tools 2>&1 | tail -8
          echo "--- after pacman ---"
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc --version 2>/dev/null | head -1
          ls -l /opt/devkitpro/libnx/lib/libnx.a 2>/dev/null | cut -c1-95

          if [ ! -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc ]; then
            echo "=== strategy 3: docker image fallback ==="
            docker pull devkitpro/devkita64:latest
            sudo mkdir -p /opt/devkitpro
            docker run --rm -v /opt/devkitpro:/host-dkp devkitpro/devkita64:latest \
              cp -a /opt/devkitpro/. /host-dkp/
          fi
          echo "--- final toolchain ---"
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc --version | head -1
          ls -l /opt/devkitpro/libnx/lib/libnx.a /opt/devkitpro/libnx/switch.ld 2>/dev/null | cut -c1-95

      - name: build probe_mmap with the IMAGE libnx (known-good reference)
        run: |
          set +e
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitA64
          sudo cp -a /opt/devkitpro/libnx /opt/libnx-image
          echo "--- image libnx backed up ---"
          cd "$GITHUB_WORKSPACE/probes"
          make -s PROBE=mmap 2>&1 | tail -5
          echo "=== probe_mmap (image libnx) make rc=$? ==="
          ls -l probe_mmap.nro 2>/dev/null
          cp -f probe_mmap.nro /tmp/probe_mmap_image.nro 2>/dev/null
          exit 0

      - name: build+install libnx from source (firmware 23.0.0 support)
        run: |
          # The docker image's libnx is from Feb 2026; FW 23.0.0 (Sep 2026)
          # needs newer libnx ("svc/spl: update types for 23.0.0" landed Sep 17).
          # Homebrew built with the old libnx crashes on FW 23 even in official
          # devkitPro builds, which is exactly what we saw on hardware.
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitA64
          git clone --depth 1 https://github.com/switchbrew/libnx.git /tmp/libnx-src
          cd /tmp/libnx-src
          make -j4 2>&1 | tail -4
          sudo env DEVKITPRO=/opt/devkitpro DEVKITARM=/opt/devkitpro/devkitA64 \
            make install 2>&1 | tail -4
          ls -l /opt/devkitpro/libnx/lib/libnx.a /opt/devkitpro/libnx/switch.ld

      - name: build probe_mmap with the NEW (source-built) libnx
        run: |
          set +e
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitA64
          cd "$GITHUB_WORKSPACE/probes"
          make -s clean >/dev/null 2>&1
          rm -f probe_mmap.nro
          make -s PROBE=mmap 2>&1 | tail -5
          echo "=== probe_mmap (new libnx) make rc=$? ==="
          ls -l probe_mmap.nro 2>/dev/null
          cp -f probe_mmap.nro /tmp/probe_mmap_new.nro 2>/dev/null
          exit 0

      - name: gclient sync chromium (no history)
        run: |
          mkdir -p "$WORK" && cd "$WORK"
          gclient config --name=src "https://chromium.googlesource.com/chromium/src.git" --unmanaged
          timeout 2700 gclient sync --no-history -j4 > /tmp/sync.log 2>&1
          rc=$?
          echo "=== sync rc=$rc ==="
          tail -5 /tmp/sync.log
          df -h / | tail -1
          exit $rc

      - name: Overlay Switch config
        run: |
          mkdir -p "$WORK/src/port/chromium"
          cp -rv "$GITHUB_WORKSPACE/port/chromium/." "$WORK/src/port/chromium/"
          echo "--- replacing root BUILD.gn (engine-only graph) ---"
          cp "$WORK/src/port/chromium/BUILD.gn" "$WORK/src/BUILD.gn"
          echo "--- toolchain + libnx inside the tree ---"
          ln -sfn /opt/devkitpro/devkitA64 "$WORK/src/third_party/devkitA64"
          ln -sfn /opt/devkitpro/libnx "$WORK/src/third_party/libnx"
          ls -l "$WORK/src/third_party/devkitA64/bin/aarch64-none-elf-gcc"
          ls -d "$WORK/src/third_party/libnx/include"
          echo "--- does clang accept -mtp=soft? ---"
          "$WORK/src/third_party/llvm-build/Release+Asserts/bin/clang++" \
            --target=aarch64-none-elf -mtp=soft -c -x c++ /dev/null -o /tmp/mtp.o 2>&1 | head -3
          echo "mtp probe rc=$? (0 = accepted)"
          echo "--- regenerate lld-compatible switch.ld from the installed libnx ---"
          python3 port/chromium/patch_switch_ld.py /opt/devkitpro/libnx/switch.ld \
            "$WORK/src/port/chromium/switch.ld"
          echo "--- patching BUILDCONFIG (wire switch_config into default configs) ---"
          cd "$WORK/src" && python3 port/chromium/patch.py
          chmod +x port/chromium/ld_wrapper.py port/chromium/patch.py 2>/dev/null || true
          sudo install -m 755 port/chromium/ld_wrapper.py /usr/local/bin/nx-ld-wrapper
          echo "--- args.gn ---"
          cat "$WORK/src/port/chromium/args.gn"

      - name: gn gen
        run: |
          cd "$WORK/src"
          GN=buildtools/linux64/gn
          [ -x "$GN" ] || GN=gn
          echo "gn: $($GN --version 2>&1)"
          ARGS="$(grep -v '^#' port/chromium/args.gn | tr '\n' ' ')"
          echo "args: $ARGS"
          set +e
          timeout 900 "$GN" gen out/switch --args="$ARGS" > /tmp/gn.log 2>&1
          rc=$?
          echo "=== gn gen rc=$rc ==="
          grep -aE 'ERROR|error|Unresolved|assert' /tmp/gn.log | head -30
          tail -20 /tmp/gn.log
          exit 0

      - name: ninja base
        run: |
          cd "$WORK/src"
          [ -d out/switch ] || { echo "no out/switch (gn gen failed)"; exit 0; }
          set +e
          timeout 3000 ninja -C out/switch -j4 base nx_smoke > /tmp/ninja.log 2>&1
          rc=$?
          echo "=== ninja base rc=$rc ==="
          echo "--- ninja.log tail (link errors live here) ---"
          tail -n 90 /tmp/ninja.log | sed 's/\x1b\[[0-9;]*m//g'
          echo "--- end tail ---"
          echo "--- ar command for libbase.a ---"
          (cd "${WORK}/src/out/switch" && ninja -t commands obj/base/libbase.a 2>/dev/null | tail -2) || true
          echo "--- end ar ---"
          echo "--- object arch + link cmd ---"
          (cd "${WORK}/src/out/switch" && file obj/nx_smoke/smoke_main.o obj/third_party/zlib/zlib/crc32.o 2>&1 | head -4) || true
          (cd "${WORK}/src/out/switch" && ../../third_party/devkitA64/aarch64-none-elf/bin/readelf -h obj/nx_smoke/smoke_main.o 2>&1 | head -8) || true
          (cd "${WORK}/src/out/switch" && ninja -t commands nx_smoke 2>/dev/null | tail -1 > /tmp/linkcmd.txt; grep -o -- '--target=[^ ]*' /tmp/linkcmd.txt | head -2; grep -o -- '-fuse-ld=[^ ]*' /tmp/linkcmd.txt | head -2) || true
          echo "--- end object arch ---"
          echo "--- ld debug ---"
          /opt/devkitpro/devkitA64/aarch64-none-elf/bin/ld --version 2>&1 | head -2
          (cd "${WORK}/src/out/switch" && ../../third_party/devkitA64/aarch64-none-elf/bin/readelf -h obj/nx_smoke/smoke_main.o | grep -E 'Machine|Flags|Type')
          head -c 1500 /tmp/ld_wrapper_args.txt 2>/dev/null | tr ' ' '\n' | grep -E '^-m$|^aarch64|^-T$|switch.ld' | head -12
          echo "--- end ld debug ---"
          echo "--- objdump view ---"
          (cd "${WORK}/src/out/switch" && ls -l obj/nx_smoke/smoke_main.o obj/third_party/zlib/zlib/crc32.o)
          (cd "${WORK}/src/out/switch" && ../../third_party/devkitA64/aarch64-none-elf/bin/objdump -f obj/nx_smoke/smoke_main.o 2>&1 | head -8)
          (cd "${WORK}/src/out/switch" && od -An -tx1 -N 64 obj/nx_smoke/smoke_main.o)
          echo "--- end objdump view ---"
          grep -aE 'FAILED|fatal error|error:|undefined reference' /tmp/ninja.log \
            | sed 's/^\[\?[0-9]*\/[0-9]*\]\? *//' | sort -u | head -25
          tail -15 /tmp/ninja.log
          echo "=== M4: ELF sanity ==="
          ELF="${WORK}/src/out/switch/nx_smoke"
          if [ -f "$ELF" ]; then
            ls -l "$ELF"
            /opt/devkitpro/devkitA64/aarch64-none-elf/bin/readelf -hlW "$ELF" | head -60 || true
            echo "--- dynamic relocs ---"
            /opt/devkitpro/devkitA64/aarch64-none-elf/bin/readelf -dW "$ELF" | head -20 || true
            echo "--- dyn-syms summary (should be tiny, ideally 0 exported) ---"
            /opt/devkitpro/devkitA64/aarch64-none-elf/bin/readelf -sW --dyn-syms "$ELF" 2>/dev/null | head -12 || true
            echo "--- reloc types ---"
            /opt/devkitpro/devkitA64/aarch64-none-elf/bin/readelf -rW "$ELF" 2>/dev/null | awk '/R_AARCH64/ {print $3}' | sort | uniq -c | head -10 || true
            echo "--- TEXTREL check (must be empty) ---"
            /opt/devkitpro/devkitA64/aarch64-none-elf/bin/readelf -dW "$ELF" | grep -i textrel || echo "no TEXTREL flag"
            echo "--- text-reloc sections (where are the 408 relocs?) ---"
            /opt/devkitpro/devkitA64/aarch64-none-elf/bin/readelf -rW "$ELF" 2>/dev/null | grep -B2 'R_AARCH64_ABS64' | head -20 || true
            echo "--- reloc count in .text ---"
            /opt/devkitpro/devkitA64/aarch64-none-elf/bin/readelf -rW "$ELF" 2>/dev/null | grep -c 'R_AARCH64' || true
          else
            echo "nx_smoke ELF missing"
          fi
          echo "=== M4: package NRO ==="
          if [ -f "$ELF" ] && [ -x /opt/devkitpro/tools/bin/elf2nro ]; then
            # Application-mode launches read the NACP; generate one so Sphaira /
            # hbmenu have proper title metadata.
            /opt/devkitpro/tools/bin/nacptool --create "nx_smoke" "Chromium-NX" "0.1" /tmp/nx_smoke.nacp 2>&1 | tail -2
            /opt/devkitpro/tools/bin/elf2nro "$ELF" "${WORK}/src/out/switch/nx_smoke.nro" --icon=/opt/devkitpro/libnx/default_icon.jpg --nacp=/tmp/nx_smoke.nacp 2>&1 | tail -5
            ls -l "${WORK}/src/out/switch/nx_smoke.nro" 2>/dev/null || true
          else
            echo "elf2nro not available or ELF missing"
          fi
          exit 0

      - name: build reference NRO with devkitPro GCC (control sample)
        run: |
          set +e
          DKP=/opt/devkitpro
          export DEVKITPRO=$DKP
          export DEVKITARM=$DKP/devkitA64
          SRC="$GITHUB_WORKSPACE/port/chromium/ref_hello.c"
          cd /tmp
          $DKP/devkitA64/bin/aarch64-none-elf-gcc \
            -specs=$DKP/libnx/switch.specs \
            -I$DKP/libnx/include \
            -g -O2 -ffunction-sections \
            -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE \
            -Wl,-z,notext \
            -o /tmp/ref_hello.elf "$SRC" \
            -L$DKP/libnx/lib -lnx
          rc=$?
          echo "=== ref gcc rc=$rc ==="
          ls -l /tmp/ref_hello.elf 2>/dev/null
          if [ $rc -eq 0 ]; then
            $DKP/tools/bin/nacptool --create "ref_hello" "devkitPro" "1.0" /tmp/ref_hello.nacp 2>&1 | tail -2
            $DKP/tools/bin/elf2nro /tmp/ref_hello.elf /tmp/ref_hello.nro --icon=$DKP/libnx/default_icon.jpg --nacp=/tmp/ref_hello.nacp 2>&1 | tail -3
            ls -l /tmp/ref_hello.nro 2>/dev/null
          fi
          exit 0

      - name: build devkitPro hello-world example (canonical control)
        run: |
          set +e
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitA64
          git clone --depth 1 https://github.com/switchbrew/switch-examples.git \
            /tmp/switch-examples
          cd /tmp/switch-examples/graphics/printing/hello-world
          make -j4 2>&1 | tail -8
          echo "=== example make rc=$? ==="
          ls -l *.nro *.elf 2>/dev/null
          cp -v *.nro /tmp/hello-world.nro 2>/dev/null
          exit 0

      - name: upload devkitPro example artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devkitpro-hello-world
          path: /tmp/hello-world.nro
          if-no-files-found: warn
          retention-days: 14

      - name: build bisect probes via devkitPro Makefile (same path as the official example)
        run: |
          set +e
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitA64
          mkdir -p /tmp/probe-nro
          cd "$GITHUB_WORKSPACE/probes"
          for p in exit console printf; do
            mkdir -p "src/$p"
            cp "$GITHUB_WORKSPACE/port/chromium/probe_$p.c" "src/$p/main.c"
            make -s PROBE=$p clean >/dev/null 2>&1
            make -s PROBE=$p 2>&1 | tail -4
            echo "probe_$p make rc=$?"
            cp -f "probe_$p.nro" "/tmp/probe-nro/probe_$p.nro" 2>/dev/null
          done
          ls -l /tmp/probe-nro/*.nro 2>/dev/null
          exit 0

      - name: upload bisect probes artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bisect-probes
          path: /tmp/probe-nro/*.nro
          if-no-files-found: warn
          retention-days: 14

      - name: upload reference NRO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ref_hello-nro
          path: /tmp/ref_hello.nro
          if-no-files-found: warn
          retention-days: 14

      - name: upload NRO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nx_smoke-nro
          path: work/src/out/switch/nx_smoke.nro
          if-no-files-found: warn
          retention-days: 14
