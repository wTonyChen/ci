name: probes

on:
  push:
    paths: ['probes/**', '.github/workflows/probes.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install extra portlibs (mesa, needed by the GL probe)
        run: dkp-pacman -S --noconfirm --needed switch-mesa

      - name: Build all probes
        run: |
          export DEVKITPRO=/opt/devkitpro
          cd probes
          bash build-all.sh

      - name: Show artifacts
        if: always()
        run: |
          ls -l probes/build/*/*.nro || echo "(no .nro produced)"

      - name: Upload .nro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probes-nro
          path: probes/build/*/*.nro
          if-no-files-found: warn
