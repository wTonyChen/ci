name: probes

# Lives on the default branch (main); the payload is on master.
# NOTE: a step name once contained "flat: ..." -- an unquoted colon+space. That
# made the whole file invalid YAML, which GitHub reports as "Workflow does not
# have 'workflow_dispatch' trigger" (422) and runs as a startup failure with 0
# jobs. Keep every unquoted scalar colon-free.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probes.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Install extra portlibs (mesa, needed by the GL probe)
        run: dkp-pacman -S --noconfirm --needed switch-mesa

      - name: Build all probes
        run: |
          export DEVKITPRO=/opt/devkitpro
          cd probes
          bash build-all.sh

      - name: Collect .nro (flat zip - no per-probe folder)
        if: always()
        run: |
          mkdir -p probes/dist
          find probes/build -name '*.nro' -exec cp -f {} probes/dist/ \;
          ls -l probes/dist || echo "(no .nro produced)"

      - name: Upload .nro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probes-nro
          path: probes/dist/*.nro
          if-no-files-found: warn
