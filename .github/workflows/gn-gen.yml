name: gn-gen

# Runs gclient sync + gn gen on GitHub's network (does NOT use the local proxy).
# Logs are read with:  gh run view <id> -R wTonyChen/ci --log-failed
on:
  workflow_dispatch:
    inputs:
      cobalt_ref:
        description: 'Cobalt revision (gclient url@rev form)'
        default: 'refs/heads/27.lts'
        required: true

jobs:
  gn-gen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      WORK: ${{ github.workspace }}/work
      GN_CC_COMPILER: /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc
      GN_CXX_COMPILER: /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++
      GN_AR_COMPILER: /opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar
      GN_LD_COMPILER: /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++
      # -D__linux__ keeps the compiler-side view consistent with the GN-level
      # current_os="linux" choice: build/build_config.h otherwise falls through to
      # "#error Please add support for your platform" (OS_LINUX/OS_POSIX undefined).
      # _GNU_SOURCE/_DEFAULT_SOURCE: Chromium compiles with -std=c++17 (strict ANSI),
      # which hides newlib's POSIX declarations (CLOCK_THREAD_CPUTIME_ID, setpriority,
      # PRIO_PROCESS, ...) behind feature-test macros.
      GN_C_FLAGS: -D__SWITCH__ -D__linux__ -D_GNU_SOURCE -D_DEFAULT_SOURCE -I${{ github.workspace }}/work/src/portinc -I/opt/devkitpro/libnx/include -march=armv8-a -mtune=cortex-a57
      GN_CXX_FLAGS: -D__SWITCH__ -D__linux__ -D_GNU_SOURCE -D_DEFAULT_SOURCE -I${{ github.workspace }}/work/src/portinc -I/opt/devkitpro/libnx/include -march=armv8-a -mtune=cortex-a57
      GN_LD_FLAGS: -L/opt/devkitpro/libnx/lib
    steps:
      - uses: actions/checkout@v4

      - name: Fetch depot_tools (cache first)
        run: |
          mkdir -p .cache
          if [ -d .cache/depot_tools ]; then
            cp -a .cache/depot_tools /opt/depot_tools
          else
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /opt/depot_tools
            cp -a /opt/depot_tools .cache/depot_tools
          fi
          echo "/opt/depot_tools" >> "$GITHUB_PATH"

      - name: Cache toolchains (depot_tools + devkitA64)
        uses: actions/cache@v4
        with:
          path: |
            .cache/depot_tools
            .cache/devkitpro
          key: tools-${{ runner.os }}-devkitA64-v1

      - name: Free disk space and install devkitA64 from the official image
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean || true
          echo "--- after cleanup ---"; df -h / | tail -1

          # devkitA64 without containerising the whole job (the container's writable
          # layer lives on the same small disk and we cannot free host space from it)
          mkdir -p .cache
          if [ -x .cache/devkitpro/devkitA64/bin/aarch64-none-elf-gcc ]; then
            echo "devkitA64: restoring from cache"
            sudo cp -a .cache/devkitpro /opt/devkitpro
          else
            echo "devkitA64: pulling the official image"
            docker pull devkitpro/devkita64:latest
            sudo mkdir -p /opt/devkitpro
            # cp -a through a bind mount: docker cp rejects a symlink in the image
            # that points outside the copied tree
            docker run --rm -v /opt/devkitpro:/host-dkp devkitpro/devkita64:latest \
              cp -a /opt/devkitpro/. /host-dkp/
            sudo cp -a /opt/devkitpro .cache/devkitpro
          fi
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc --version | head -1
          echo "--- after devkitPro ---"; df -h / | tail -1

      - name: gclient config and sync (Cobalt, no history)
        run: |
          mkdir -p "$WORK" && cd "$WORK"
          gclient config --name=src "https://github.com/youtube/cobalt.git@${{ inputs.cobalt_ref }}"
          gclient sync --no-history -j4
          echo "--- top-level entries ---"
          ls -1 src | head -30

      - name: Overlay port tree
        run: |
          echo "--- copying port/tree into the Cobalt checkout ---"
          cp -rv "$GITHUB_WORKSPACE/port/tree/." "$WORK/src/" 2>&1 | tail -20 || true

      - name: Apply port patches to the Cobalt tree
        run: |
          cd "$WORK/src"
          python3 "$GITHUB_WORKSPACE/port/patches/apply.py"

      - name: gn gen
        run: |
          cd "$WORK/src"
          GN=./buildtools/linux64/gn; [ -x "$GN" ] || GN=gn
          echo "using gn: $GN"
          ARGS_FILE=cobalt/build/configs/nx-arm64/args.gn
          if [ -f "$ARGS_FILE" ]; then
            ARGS="$(grep -v '^#' "$ARGS_FILE" | tr '\n' ' ')"
          else
            ARGS='target_os="nx" target_cpu="arm64"'
          fi
          echo "gn args: $ARGS"
          set +e
          timeout 900 "$GN" gen out/nx --args="$ARGS"
          echo "gn gen exit=$?"
          echo "--- effective args ---"
          for a in is_cobalt is_starboard starboard_path starboard_target_platform; do
            echo -n "$a = "
            "$GN" args out/nx --list 2>/dev/null | grep -A1 "^$a$" | tail -1 | sed 's/.*= //'
          done
          echo "--- force-load our platform targets (this is where real errors show up) ---"
          echo "[gn ls]";    "$GN" ls out/nx '//starboard/nx/arm64/*' 2>&1 | head -12
          echo "[gn desc]";  "$GN" desc out/nx '//starboard/nx/arm64:platform_targets' 2>&1 | head -12
          echo "[gn check]"; "$GN" check out/nx '//starboard/nx/arm64/*' 2>&1 | head -25
          set -e

      - name: ninja (Starboard platform library + a real executable)
        run: |
          cd "$WORK/src"
          GN=./buildtools/linux64/gn; [ -x "$GN" ] || GN=gn

          # Build the first product of a target matching a label pattern.
          # $1 = label pattern, $2 = regex the product path must match
          # $1 = gn ls pattern, $2 = product regex, $3 = optional label filter
          build() {
            local label out labels
            labels=$("$GN" ls out/nx "$1" 2>/dev/null | grep '^//')
            if [ -n "$3" ]; then labels=$(echo "$labels" | grep -F "$3"); fi
            for label in $labels; do
              out=$("$GN" desc out/nx "$label" outputs 2>/dev/null \
                    | tr ' ' '\n' | grep -E "$2" | head -1 \
                    | sed 's|^//out/nx/||; s|^//||')
              if [ -n "$out" ]; then
                echo "=== $label -> $out ==="
                timeout 1800 ninja -C out/nx -j4 "$out" 2>&1 | tail -45
                echo "=== ninja exit=${PIPESTATUS[0]} ==="
                return
              fi
            done
            echo "=== no product for '$1' (regex $2, filter '$3') ==="
            "$GN" ls out/nx "$1" 2>/dev/null | grep '^//' | head -5
          }

          set +e
          build '//starboard/nx/arm64:*' '\.a$' 'starboard_platform_with_main'
          build '//starboard/nx/arm64:*' '\.a$'
          set -e

      - name: link probe (which libc/POSIX symbols is the platform missing?)
        run: |
          cd "$WORK/src"
          LIB=$(ls out/nx/starboard/obj/starboard/nx/arm64/libstarboard_platform.a 2>/dev/null \
                || find out/nx -name 'libstarboard_platform.a' 2>/dev/null | head -1)
          echo "LIB=$LIB"
          ls -la "$LIB" 2>/dev/null || exit 0
          set +e
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ \
            -o /tmp/nx_link_probe.elf \
            -Wl,--whole-archive "$LIB" -Wl,--no-whole-archive \
            -Wl,--start-group -L/opt/devkitpro/libnx/lib -lnx -lm -Wl,--end-group \
            -Wl,--gc-sections 2>&1 | tee /tmp/link.log | head -60
          echo "link exit=${PIPESTATUS[0]}"
          echo "--- undefined symbols, grouped ---"
          grep -oE "undefined reference to [^']*" /tmp/link.log 2>/dev/null \
            | sed "s/undefined reference to //" | sort | uniq -c | sort -rn | head -60
          set -e
