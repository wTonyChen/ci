name: gn-gen

# Runs gclient sync + gn gen on GitHub's network (does NOT use the local proxy).
# Logs are read with:  gh run view <id> -R wTonyChen/ci --log-failed
on:
  workflow_dispatch:
    inputs:
      cobalt_ref:
        description: 'Cobalt revision (gclient url@rev form)'
        default: 'refs/heads/27.lts'
        required: true

jobs:
  gn-gen:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest    # provides aarch64-none-elf-* and libnx
    timeout-minutes: 300
    env:
      WORK: /mnt/ci
      GN_CC_COMPILER: aarch64-none-elf-gcc
      GN_CXX_COMPILER: aarch64-none-elf-g++
      GN_AR_COMPILER: aarch64-none-elf-ar
      GN_LD_COMPILER: aarch64-none-elf-g++
      GN_C_FLAGS: -D__SWITCH__ -I/opt/devkitpro/libnx/include -march=armv8-a -mtune=cortex-a57
      GN_CXX_FLAGS: -D__SWITCH__ -I/opt/devkitpro/libnx/include -march=armv8-a -mtune=cortex-a57
      GN_LD_FLAGS: -L/opt/devkitpro/libnx/lib
    steps:
      - uses: actions/checkout@v4

      - name: Fetch depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /opt/depot_tools
          echo "/opt/depot_tools" >> "$GITHUB_PATH"

      - name: Show mounts and free disk space
        run: |
          df -h / /mnt || true
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          aarch64-none-elf-gcc --version 2>&1 | head -1 || echo "NO devkitA64!"
          python3 --version 2>&1 || (apt-get update -qq && apt-get install -y -qq python3) || true
          git --version
          df -h / /mnt || true

      - name: gclient config and sync (Cobalt, no history)
        run: |
          mkdir -p "$WORK" && cd "$WORK"
          gclient config --name=src "https://github.com/youtube/cobalt.git@${{ inputs.cobalt_ref }}"
          gclient sync --no-history -j4
          echo "--- top-level entries ---"
          ls -1 src | head -30

      - name: Overlay port tree
        run: |
          echo "--- copying port/tree into the Cobalt checkout ---"
          cp -rv "$GITHUB_WORKSPACE/port/tree/." "$WORK/src/" 2>&1 | tail -20 || true

      - name: Register the nx platform
        run: |
          cd "$WORK/src"
          python3 - <<'PY'
          p = 'starboard/build/platforms.py'
          s = open(p).read()
          if 'nx-arm64' not in s:
              s = s.replace("    'stub': 'starboard/stub',",
                            "    'nx-arm64': 'starboard/nx/arm64',\n    'stub': 'starboard/stub',")
              open(p, 'w').write(s)
              print('registered nx-arm64')
          else:
              print('nx-arm64 already registered')

          # starboard_target_platform is declared in platform_path.gni, which is not
          # imported while gn parses --args, so the argument is ignored and the build
          # falls back to linux-x64x11. Patch the linux branch assignment instead.
          q = 'starboard/build/platform_path.gni'
          t = open(q).read()
          old = 'starboard_target_platform = "linux-x64x11"'
          if 'nx-arm64' not in t:
              assert old in t, 'anchor not found in platform_path.gni'
              open(q, 'w').write(t.replace(old, 'starboard_target_platform = "nx-arm64"   # Chromium-NX', 1))
              print('patched platform_path.gni -> nx-arm64')
          else:
              print('platform_path.gni already patched')
          PY

      - name: gn gen
        run: |
          cd "$WORK/src"
          GN=./buildtools/linux64/gn; [ -x "$GN" ] || GN=gn
          echo "using gn: $GN"
          ARGS_FILE=cobalt/build/configs/nx-arm64/args.gn
          if [ -f "$ARGS_FILE" ]; then
            ARGS="$(grep -v '^#' "$ARGS_FILE" | tr '\n' ' ')"
          else
            ARGS='target_os="nx" target_cpu="arm64"'
          fi
          echo "gn args: $ARGS"
          set +e
          timeout 900 "$GN" gen out/nx --args="$ARGS"
          echo "gn gen exit=$?"
          echo "--- effective args ---"
          for a in is_cobalt is_starboard starboard_path starboard_target_platform; do
            echo -n "$a = "
            "$GN" args out/nx --list 2>/dev/null | grep -A1 "^$a$" | tail -1 | sed 's/.*= //'
          done
          echo "--- force-load our platform targets (this is where real errors show up) ---"
          echo "[gn ls]";    "$GN" ls out/nx '//starboard/nx/arm64/*' 2>&1 | head -12
          echo "[gn desc]";  "$GN" desc out/nx '//starboard/nx/arm64:platform_targets' 2>&1 | head -12
          echo "[gn check]"; "$GN" check out/nx '//starboard/nx/arm64/*' 2>&1 | head -25
          set -e

      - name: ninja (first real Switch compile)
        run: |
          cd "$WORK/src"
          set +e
          T=$(ninja -C out/nx -t targets all 2>/dev/null | grep -m1 'starboard_platform' | cut -d: -f1)
          echo "ninja target: $T"
          timeout 900 ninja -C out/nx -j4 "$T" 2>&1 | tail -60
          echo "ninja exit=${PIPESTATUS[0]}"
          set -e
