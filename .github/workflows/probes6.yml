name: probes6

# Lives on the default branch (main); the payload is on master.
# NOTE: workflow_dispatch on this file keeps answering 422 ("does not have
# workflow_dispatch trigger") even though the trigger is present, so we kick it
# with a push to this file instead.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probes6.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Install extra portlibs (mesa, needed by the GL probe)
        run: dkp-pacman -S --noconfirm --needed switch-mesa
